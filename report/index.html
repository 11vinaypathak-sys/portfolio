<!doctype html><meta charset="utf-8"><title>Infrastructure finance report: the making of</title><style>html,body{margin:0;background:#123f35;overflow:hidden}canvas{position:absolute;inset:0;width:100vw;height:100vh;object-fit:contain}#hint{position:fixed;bottom:12px;left:0;right:0;text-align:center;color:#e5eee8;font:13px Arial;opacity:.8}</style><canvas id="base" width="1600" height="900"></canvas><canvas id="curl" width="1600" height="900"></canvas><div id="hint">Click or use arrow keys to turn the page</div><script>
const base=document.querySelector('#base'),ctx=base.getContext('2d'),can=document.querySelector('#curl'),gl=can.getContext('webgl',{alpha:true,preserveDrawingBuffer:true,antialias:true});
const vs=`attribute vec2 pos;uniform float t;varying vec2 uv;void main(){uv=pos;float u=pos.x;float a=3.14159265*t;float bend=sin(a)*0.56;float xx=0.;float zz=0.;for(int i=0;i<40;i++){float s=(float(i)+.5)/40.*u;float theta=a+bend*sin(s*3.14159265);xx+=cos(theta)*u/40.;zz+=sin(theta)*u/40.;}float x=800.+xx*530.;float z=zz*530.;float sc=1.+z/3800.;float y=449.+(pos.y-.5)*736.*sc;gl_Position=vec4((x-800.)/800.,(450.-y)/450.,-z/1000.,1.);}`;
const fs=`precision highp float;varying vec2 uv;uniform sampler2D front;uniform sampler2D back;uniform float t;void main(){vec4 c;if(gl_FrontFacing){c=texture2D(front,vec2(uv.x,uv.y));}else{c=texture2D(back,vec2(1.-uv.x,uv.y));}float shade=1.-sin(3.14159265*t)*(.09+.07*sin(uv.x*3.14159265));gl_FragColor=vec4(c.rgb*shade,1.);}`;
function shader(type,src){let s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s}
let pr=gl.createProgram();gl.attachShader(pr,shader(gl.VERTEX_SHADER,vs));gl.attachShader(pr,shader(gl.FRAGMENT_SHADER,fs));gl.linkProgram(pr);if(!gl.getProgramParameter(pr,gl.LINK_STATUS))throw Error(gl.getProgramInfoLog(pr));gl.useProgram(pr);
let v=[];for(let i=0;i<150;i++){let a=i/150,b=(i+1)/150;v.push(a,0,a,1,b,0,b,0,a,1,b,1)}let buf=gl.createBuffer();gl.bindBuffer(gl.ARRAY_BUFFER,buf);gl.bufferData(gl.ARRAY_BUFFER,new Float32Array(v),gl.STATIC_DRAW);let loc=gl.getAttribLocation(pr,'pos');gl.enableVertexAttribArray(loc);gl.vertexAttribPointer(loc,2,gl.FLOAT,false,0,0);gl.disable(gl.CULL_FACE);gl.clearColor(0,0,0,0);
let images=[],index=0,busy=false;
function texture(im,x,slot,name){let c=document.createElement('canvas');c.width=530;c.height=736;c.getContext('2d').drawImage(im,x,81,530,736,0,0,530,736);let tex=gl.createTexture();gl.activeTexture(gl.TEXTURE0+slot);gl.bindTexture(gl.TEXTURE_2D,tex);gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA,gl.RGBA,gl.UNSIGNED_BYTE,c);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.LINEAR);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);gl.uniform1i(gl.getUniformLocation(pr,name),slot);}
window.prepare=(i)=>{index=i;texture(images[i],800,0,'front');texture(images[i+1],270,1,'back');};
window.draw=(t)=>{gl.clear(gl.COLOR_BUFFER_BIT);if(t<=0){ctx.drawImage(images[index],0,0);return}if(t>=1){ctx.drawImage(images[index+1],0,0);return}ctx.drawImage(images[index],0,0);ctx.drawImage(images[index+1],800,0,800,900,800,0,800,900);gl.uniform1f(gl.getUniformLocation(pr,'t'),t);gl.drawArrays(gl.TRIANGLES,0,v.length/2);};
window.ready=Promise.all(Array.from({length:7},(_,i)=>new Promise(r=>{let im=new Image();im.onload=()=>{images[i]=im;r()};im.src='spread-'+i+'.png'}))).then(()=>{prepare(0);draw(0)});
async function turn(dir){if(busy)return;if(dir>0&&index>=6)return;if(dir<0&&index<=0)return;busy=true;let current=index;if(dir<0)prepare(current-1);else prepare(current);let start=performance.now();function tick(now){let u=Math.min(1,(now-start)/1500),e=u*u*(3-2*u);draw(dir>0?e:1-e);if(u<1)requestAnimationFrame(tick);else{index=current+dir;busy=false;}}requestAnimationFrame(tick)}
addEventListener('click',()=>turn(1));addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')turn(1);if(e.key==='ArrowLeft')turn(-1)});let last=0;addEventListener('wheel',e=>{if(performance.now()-last>1600){turn(e.deltaY>0?1:-1);last=performance.now()}});
</script>
